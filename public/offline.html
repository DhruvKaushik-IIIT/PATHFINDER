<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E7EDE3" />
<title>Offline · Pathfinder</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px 28px;
    background: #E7EDE3; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; }
  .card { width: 100%; max-width: 452px; padding: 30px 22px 22px; border-radius: 32px; text-align: center;
    background: rgba(250,250,252,0.86); border: 0.5px solid rgba(255,255,255,0.85); box-shadow: 0 12px 40px rgba(0,0,0,0.14); }
  .icon { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 17px; background: #0071E3; display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.3px; }
  p { margin: 0 0 18px; font-size: 16px; line-height: 1.45; color: #48484A; }
  button { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: #0071E3; color: #fff; font-family: inherit; font-size: 17px; font-weight: 600; }
  small { display: block; margin-top: 12px; font-size: 13px; color: #6E6E73; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Road conditions need a connection — they change quickly in the hills, so Pathfinder never shows an old status as current.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>In an emergency call 112 · HP disaster helpline 1077</small>
  </main>
</body>
</html>
